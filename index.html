<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e1a">
<title>月球基地 · LUNAR COLONY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#060b14;font-family:'Courier New','Consolas',monospace;touch-action:none;user-select:none;-webkit-user-select:none}
:root{
  --bg:#060b14;--panel:#0d1424;--panel2:#111c30;--border:#26324a;
  --text:#dae2f0;--dim:#6b7a9c;--accent:#f0c040;
  --good:#3ae090;--bad:#f04e4e;
  --c-energy:#f0c040;--c-oxygen:#4cb8f4;--c-mineral:#b480f0;
  --c-food:#60d870;--c-credit:#f0d070;--c-research:#4cb8f4;
  --fui-cyan:#00e5ff;--fui-amber:#f0b030;--fui-green:#00e888;
  --fui-red:#ff3040;--fui-glow:rgba(240,192,64,0.15);
}
#wrap{position:fixed;inset:0;margin:auto;width:100%;max-width:440px;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(0,10,30,.9),inset 0 0 80px rgba(0,180,255,.03)}
#topbar{flex:0 0 auto;background:linear-gradient(180deg,#0e182e,#080e1c);border-bottom:1px solid var(--fui-cyan);border-bottom-width:1px;border-image:linear-gradient(90deg,transparent,#00e5ff44,transparent) 1;padding:5px 7px 6px;position:relative}
#resrow{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 4px;font-size:9px;line-height:1.3}
.res{display:flex;align-items:center;gap:1px}
.res .ic{width:10px;height:10px;flex:0 0 auto;border-radius:1px;image-rendering:pixelated;image-rendering:crisp-edges}
.res .v{font-weight:bold;color:var(--text)}
.res .c{color:var(--dim);font-size:8px}
#datebar{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:10px;color:var(--dim)}
#datebar .day{color:var(--accent);font-weight:bold;font-size:11px}
#moralebar{display:flex;align-items:center;gap:4px}
#moralebar .ml{width:50px;height:6px;background:#060b14;border:1px solid #1e2a40;overflow:hidden}
#moralebar .mf{height:100%;background:var(--good);transition:width .3s,background .3s}
#game-wrap{flex:1 1 auto;position:relative;background:#0c1226;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#bottombar{flex:0 0 auto;background:linear-gradient(0deg,#0e182e,#080e1c);border-top:1px solid #26324a;padding:5px 6px 6px;display:flex;flex-direction:column;gap:5px}
#infobar{background:#080c18;border:1px solid #1e2a40;padding:4px 6px;font-size:9px;color:var(--dim);min-height:30px;line-height:1.3;overflow:hidden;letter-spacing:.3px}
#infobar b{color:var(--text)}
#btnrow{display:flex;gap:4px}
.btn{flex:1;background:linear-gradient(180deg,#152238,#0a1222);border:1px solid #26324a;color:var(--dim);padding:6px 2px;font-family:monospace;font-size:10px;font-weight:bold;cursor:pointer;text-align:center;border-radius:1px;position:relative;line-height:1.2;letter-spacing:.5px;transition:all .15s}
.btn:active{transform:translateY(1px)}
.btn .ic{display:block;font-size:13px;margin-bottom:1px}
.btn.accent{background:linear-gradient(180deg,#3a2810,#1e1408);border-color:var(--fui-amber);color:var(--fui-amber);box-shadow:0 0 8px rgba(240,176,48,.2)}
.btn.accent.on{background:linear-gradient(180deg,#6a4818,#3a2010);box-shadow:0 0 12px rgba(240,176,48,.5)}
.btn.good{background:linear-gradient(180deg,#0e2a20,#061610);border-color:var(--fui-green);color:var(--fui-green);box-shadow:0 0 6px rgba(0,232,136,.15)}
.btn:disabled{opacity:.4}
#speedrow{display:flex;gap:4px;justify-content:center}
.spd{background:#0a0f1e;border:1px solid #26324a;color:var(--dim);padding:3px 12px;font-size:11px;cursor:pointer;font-family:monospace;border-radius:1px;letter-spacing:.5px;transition:all .15s}
.spd.on{background:var(--fui-amber);color:#060b14;border-color:var(--fui-amber);font-weight:bold;box-shadow:0 0 10px rgba(240,176,48,.4)}
#overlay{position:fixed;inset:0;background:rgba(2,6,14,.85);display:none;align-items:center;justify-content:center;z-index:50;padding:8px;backdrop-filter:blur(2px)}
#overlay.on{display:flex}
.panel{background:var(--panel);border:1px solid #2a3650;width:100%;max-width:420px;max-height:92vh;overflow-y:auto;padding:10px;box-shadow:0 0 50px rgba(0,12,30,.8)}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:var(--border)}
.panel h2{font-size:13px;color:var(--fui-amber);text-align:center;margin-bottom:8px;border-bottom:1px solid #26324a;padding-bottom:6px;letter-spacing:2px;text-shadow:0 0 8px rgba(240,176,48,.2)}
.close-x{float:right;cursor:pointer;color:var(--fui-red);font-size:14px;line-height:1;margin-top:-4px;opacity:.7}
.close-x:active{color:#fff;opacity:1}
.blist{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.bcard{background:#0a0f1e;border:1px solid #1e2a40;padding:5px;cursor:pointer;font-size:10px;display:flex;gap:5px;align-items:center;border-radius:1px;transition:all .12s}
.bcard:active{background:#152036;border-color:var(--fui-cyan)}
.bcard.locked{opacity:.45}
.bcard.cant{border-color:var(--bad)}
.bcard canvas{width:32px;height:32px;image-rendering:pixelated;flex:0 0 auto;background:#0a0e1a;border:1px solid #000}
.bcard .info{flex:1;min-width:0}
.bcard .nm{color:var(--text);font-weight:bold;font-size:10px}
.bcard .cost{color:var(--c-credit);font-size:8px;margin-top:1px}
.bcard .desc{color:var(--dim);font-size:8px;margin-top:1px;line-height:1.2}
.rlist{display:flex;flex-direction:column;gap:5px}
.rcard{background:#0a0f1e;border:1px solid #1e2a40;padding:6px;display:flex;gap:6px;align-items:center;cursor:pointer;border-radius:1px;transition:all .12s}
.rcard.locked{opacity:.5}
.rcard.done{border-color:var(--fui-green);opacity:.7;background:#0a1a14}
.rcard.afford{border-color:var(--fui-amber);box-shadow:0 0 6px rgba(240,176,48,.15)}
.rcard:active{background:#121a2e;border-color:var(--fui-cyan)}
.rcard .info{flex:1;font-size:10px}
.rcard .nm{color:var(--text);font-weight:bold;font-size:11px}
.rcard .cost{color:var(--c-research);font-size:9px}
.rcard .eff{color:var(--good);font-size:9px;margin-top:2px}
.rcard .st{font-size:9px;font-weight:bold}
.clist{display:flex;flex-direction:column;gap:5px}
.ccard{background:#0a0f1e;border:1px solid #1e2a40;padding:6px;display:flex;gap:6px;align-items:center;font-size:10px;border-radius:1px}
.ccard canvas{width:28px;height:28px;image-rendering:pixelated;flex:0 0 auto;background:#0a0e1a}
.ccard .info{flex:1}
.ccard .nm{color:var(--text);font-weight:bold;font-size:11px}
.ccard .stat{color:var(--dim);font-size:9px;margin-top:2px}
.ccard .stat b{color:var(--accent)}
.ccard .job{font-size:9px;color:var(--good);margin-top:2px}
.ccard .asg{font-size:9px;color:var(--dim)}
.mlist{display:flex;flex-direction:column;gap:6px}
.mitem{background:#0a0f1e;border:1px solid #1e2a40;padding:8px;font-size:10px;border-radius:1px}
.mitem .t{color:var(--fui-amber);font-weight:bold;font-size:11px;margin-bottom:3px;letter-spacing:.5px}
.mitem .d{color:var(--dim);line-height:1.4}
.mitem .d b{color:var(--text)}
.mbtn{display:block;width:100%;background:linear-gradient(180deg,#152238,#0a1222);border:1px solid #26324a;color:var(--dim);padding:8px;font-family:monospace;font-size:11px;font-weight:bold;cursor:pointer;margin-top:6px;border-radius:1px;letter-spacing:.5px;transition:all .15s}
.mbtn:active{transform:translateY(1px)}
.mbtn.danger{border-color:var(--fui-red);color:var(--fui-red);background:linear-gradient(180deg,#2a1018,#1a0810)}
#eventpop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);z-index:60;padding:16px}
#eventpop.on{display:flex}
.evbox{background:var(--panel);border:1px solid var(--fui-amber);padding:14px;max-width:340px;width:100%;text-align:center;border-radius:1px;box-shadow:0 0 40px rgba(240,176,48,.2),0 0 80px rgba(240,176,48,.08)}
.evbox h3{color:var(--fui-amber);font-size:14px;margin-bottom:8px;letter-spacing:2px;text-shadow:0 0 10px rgba(240,176,48,.3)}
.evbox canvas{display:block;margin:0 auto 8px;image-rendering:pixelated;background:#0a0e1a;border:1px solid var(--border)}
.evbox p{color:var(--text);font-size:11px;margin-bottom:10px;line-height:1.5}
.evbox .evbtn{background:var(--fui-amber);color:#060b14;border:none;padding:8px 24px;font-family:monospace;font-weight:bold;cursor:pointer;font-size:11px;border-radius:1px;box-shadow:0 0 12px rgba(240,176,48,.3)}
.evbox .evbtn:active{transform:translateY(1px)}
#toast{position:fixed;top:46%;left:50%;transform:translate(-50%,-50%);background:rgba(4,8,20,.94);color:var(--text);padding:7px 13px;font-size:10px;border:1px solid #26324a;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:84%;text-align:center;border-radius:1px;line-height:1.4;letter-spacing:.5px}
#toast.on{opacity:1}
#toast.bad{border-color:var(--bad);color:var(--bad)}
#toast.good{border-color:var(--good);color:var(--good)}
#title{position:fixed;inset:0;background:radial-gradient(ellipse at center,#0e1830 0%,#030814 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:80;padding:20px}
#title canvas{width:180px;height:180px;image-rendering:pixelated;margin-bottom:16px}
#title h1{color:var(--fui-amber);font-size:24px;margin-bottom:2px;letter-spacing:4px;text-shadow:0 0 20px rgba(240,176,48,.6),0 0 40px rgba(240,176,48,.2)}
#title h2{color:var(--text);font-size:11px;margin-bottom:18px;letter-spacing:2px;opacity:.7}
#title .start{background:var(--fui-amber);color:#060b14;border:none;padding:12px 36px;font-family:monospace;font-weight:bold;font-size:14px;cursor:pointer;letter-spacing:3px;border-radius:1px;box-shadow:0 0 24px rgba(240,176,48,.5),0 0 60px rgba(240,176,48,.15)}
#title .start:active{transform:translateY(1px)}
#title .tip{color:var(--dim);font-size:9px;margin-top:16px;text-align:center;line-height:1.6;padding:0 20px}
#title .tip b{color:var(--accent)}
#achbar{position:absolute;top:6px;right:8px;font-size:9px;color:var(--dim);letter-spacing:.5px}
#achbar b{color:var(--good)}
.sel-info{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(6,10,24,.94);border:1px solid var(--fui-amber);padding:6px;font-size:9px;color:var(--text);border-radius:1px;display:none;z-index:5;box-shadow:0 0 12px rgba(240,176,48,.15)}
.sel-info.on{display:block}
.sel-info .sn{color:var(--accent);font-weight:bold;font-size:11px}
.sel-info .sd{color:var(--dim);margin-top:2px;line-height:1.4}
.sel-info .sd b{color:var(--text)}
.sel-info .act{margin-top:4px;display:flex;gap:4px}
.sel-info .act button{flex:1;background:#2a3060;border:1px solid var(--border);color:var(--text);padding:4px;font-size:9px;font-family:monospace;cursor:pointer;border-radius:2px}
.sel-info .act button.del{border-color:var(--bad);color:var(--bad)}
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <div id="resrow"></div>
    <div id="datebar">
      <span><span class="day" id="daytxt">第1日</span> · <span id="timetxt">06:00</span></span>
      <div id="moralebar"><span id="morale-label">士气</span><div class="ml"><div class="mf" id="moralefill" style="width:70%"></div></div></div>
    </div>
  </div>
  <div id="game-wrap">
    <canvas id="game"></canvas>
    <div class="sel-info" id="selinfo"></div>
  </div>
  <div id="bottombar">
    <div id="infobar">欢迎来到月球！点击 <b>建造</b> 开始你的殖民地。目标：建造 <b>月球核心</b> 并拥有 20 名船员。注意：第15天起积分将开始过期！</div>
    <div id="btnrow">
      <button class="btn accent" id="btn-build"><span class="ic">⛏</span><span class="btn-label">建造</span></button>
      <button class="btn" id="btn-research"><span class="ic">🔬</span><span class="btn-label">科研</span></button>
      <button class="btn" id="btn-crew"><span class="ic">👤</span><span class="btn-label">船员</span></button>
      <button class="btn" id="btn-menu"><span class="ic">≡</span><span class="btn-label">菜单</span></button>
    </div>
    <div id="speedrow">
      <button class="spd" data-spd="0" id="spd-pause"><span id="pause-label">‖ 暂停</span></button>
      <button class="spd on" data-spd="1">▶ 1x</button>
      <button class="spd" data-spd="3">▶▶ 3x</button>
      <button class="spd" data-spd="5">▶▶▶ 5x</button>
    </div>
  </div>
</div>
<div id="overlay"><div class="panel" id="panel"></div></div>
<div id="eventpop"><div class="evbox" id="evbox"></div></div>
<div id="toast"></div>
<div id="title">
  <canvas id="title-canvas" width="72" height="72"></canvas>
  <h1 id="title-h1">月球基地</h1>
  <h2>LUNAR COLONY</h2>
  <button class="start" id="start-btn"><span class="btn-label">开始建造</span></button>
  <div id="lang-switch" style="margin-top:14px;display:flex;gap:6px;justify-content:center">
    <button class="lang-btn" data-lang="zh" style="background:#1a2030;color:#dae2f0;border:1px solid #26324a;padding:5px 14px;font-family:monospace;font-size:10px;cursor:pointer;border-radius:1px">中文</button>
    <button class="lang-btn" data-lang="en" style="background:#1a2030;color:#dae2f0;border:1px solid #26324a;padding:5px 14px;font-family:monospace;font-size:10px;cursor:pointer;border-radius:1px">English</button>
  </div>
  <div class="tip" id="title-tip">在荒芜的月球上建立繁荣殖民地<br>管理 <b>7种资源</b> · 招募 <b>船员</b> · 研发 <b>24项科技</b><br>建造 <b>17种建筑</b> · 应对 <b>23种事件</b> · 建造 <b>月球核心</b> 达成胜利</div>
</div>

function T(zh){
  if(I18N.lang === 'zh') return zh;
  const en = I18N.en[zh];
  return en !== undefined ? en : zh;
}
function TF(zh, ...args){
  let s = T(zh);
  for(const a of args) s = s.replace('%s', a);
  return s;
}
function setLang(lang){
  I18N.lang = lang;
  localStorage.setItem('lunarColonyLang', lang);
  if(typeof updateHUD === 'function') updateHUD();
  // Refresh open overlay panel
  const ov = document.getElementById('overlay');
  if(ov && ov.classList.contains('on')){
    const panel = document.getElementById('panel');
    const html = panel ? panel.innerHTML : '';
    if(html.includes('blist')) showBuildMenu();
    else if(html.includes('rlist')) showResearchMenu();
    else if(html.includes('clist')||html.includes('ccard')) showCrewMenu();
    else if(html.includes('mitem')) showMenu();
    else if(html.includes('evbtn')&&(html.includes('当前金币')||html.includes(T('当前金币')))) showTradeMenu();
    // Event popup and other dynamic popups are harder to refresh,
    // but they're short-lived so acceptable
  }
  // Refresh selinfo if a building is selected
  if(typeof G !== 'undefined' && G.selected != null && G.grid[G.selected]){
    showSelInfo(G.selected);
  }
}

function drawResIcon(c, key){
  c.imageSmoothingEnabled = false;
  c.fillStyle = '#0d1020';
  c.fillRect(0,0,10,10);
  const px = (x,y,w,h,col)=>{ c.fillStyle=col; c.fillRect(x,y,w,h); };
  switch(key){
    case 'energy': // 闪电
      px(2,0,2,2,'#c89828');
      px(2,0,2,1,'#ffd34e');
      px(4,2,2,2,'#ffd34e');
      px(3,2,1,2,'#ffd34e');
      px(2,4,2,3,'#ffd34e');
      px(4,6,2,2,'#ffd34e');
      px(6,4,2,3,'#fff8d8');
      px(4,7,2,2,'#c89828');
      px(5,7,1,1,'#fff8d8');
      px(2,7,2,2,'#c89828');
      break;
    case 'oxygen': // 气泡 O2
      px(1,2,3,6,'#7ad7ff');
      px(2,1,2,8,'#7ad7ff');
      px(3,2,1,1,'#9ae0ff');
      px(3,7,1,1,'#9ae0ff');
      px(5,4,3,3,'#7ad7ff');
      px(6,3,2,5,'#7ad7ff');
      px(6,3,1,1,'#9ae0ff');
      px(7,4,1,1,'#9ae0ff');
      px(1,8,3,1,'#3a88c8');
      px(5,7,3,1,'#3a88c8');
      break;
    case 'mineral': // 晶体/碎块
      px(2,3,6,4,'#8868c8');
      px(1,4,8,3,'#c9a0ff');
      px(3,2,4,2,'#c9a0ff');
      px(4,1,2,2,'#c9a0ff');
      px(2,7,6,2,'#8868c8');
      px(1,6,1,1,'#8868c8');
      px(8,6,1,1,'#8868c8');
      // 高光
      px(3,3,1,1,'#fff');
      px(4,2,1,1,'#fff');
      px(2,4,1,1,'#e8c8ff');
      break;
    case 'food': // 叶子/植物
      px(4,0,2,2,'#4a9838');

      px(4,8,2,2,'#3a7828');

      break;
    case 'credit': // 金币
      // 外圈深金

      px(2,8,6,1,'#886818');
      px(1,3,1,4,'#886818');
      px(8,3,1,4,'#886818');
      // 主体金黄
      px(2,2,6,6,'#ffd34e');
      px(3,1,4,6,'#ffd34e');
      px(3,2,4,5,'#ffe08a');

      px(4,1,2,2,'#9ae0ff');

// ---- 游戏状态 ----
let G;

function newGame(){
  G = {
    res:{}, cap:{},
    grid: Array(GRID_W*GRID_H).fill(null),
    crew: [],
    day:1, time:0.25, // 0=日出 0.5=日落
    speed:1, paused:false,
    scrollX: GRID_W/2 - VIEW_W/2, scrollY: GRID_H/2 - VIEW_H/2,
    placeMode:null, // building key
    selected:null, // selected tile index
    hover:null,
    unlocked:{rtg:false,comm:false,rec:false,core:false,medtech:false,obstech:false,watertech:false,droidtech:false,shieldtech:false},
    researchDone:{},
    morale:70,
    nextCrewId:1,
    nextEventDay: 4 + Math.floor(Math.random()*3),
    events:0,
    rover:{x:3, y:3, tx:3, ty:3, t:0, path:[]},
    particles:[],
    floats:[], // floating text
    constructAnim:[], // {idx, t}
    achievements:new Set(),
    soundOn:true,
    volume:0.7,
    musicOn:false,
    lastAchieve:0,
    tradeOffers:[],
    gameOver:false, won:false,
    shake:0,
    preview:false,
    colonistCap:0, // 居住容量
    deathTimer:0, // 资源耗尽计时器
    expiryPoints:0, // 即将过期的积分
    expiryDay:15, // 积分在第15天过期提示
    expiryWarned:false, // 是否已经预警
    expired:0, // 已过期积分累计
    healTimer:0, // 医疗计时器
    stats:{totalBuilt:0, totalResearched:0, totalEvents:0, totalRecruited:0, startTime:Date.now()},
  };
  for(const r of RES){ G.res[r.key]=r.start; G.cap[r.key]=r.cap; }
  // 重新生成地形
  terrain = generateTerrain();
  // 初始船员
  addCrew(T('指挥官 阿尔法'), {mining:2, farming:2, science:3, eng:4});
  addCrew(T('工程师 贝塔'), {mining:3, farming:2, science:2, eng:4});
  // 初始建筑：一个居住舱 + 太阳能板
  const cx = Math.floor(GRID_W/2), cy = Math.floor(GRID_H/2);
  placeBuilding('habitat', cx, cy, true);
  placeBuilding('solar', cx+1, cy, true);
  placeBuilding('solar', cx-1, cy, true);
  placeBuilding('oxygen', cx, cy+1, true);
  G.scrollX = cx - VIEW_W/2 + 0.5;
  G.scrollY = cy - VIEW_H/2 + 0.5;
}

function addCrew(name, stats){
  G.crew.push({
    id: G.nextCrewId++, name:name,
    mining:stats.mining||1, farming:stats.farming||1, science:stats.science||1, eng:stats.eng||1,
    job:null, // assigned building idx
    x: GRID_W/2 + (Math.random()-0.5)*2, y: GRID_H/2 + (Math.random()-0.5)*2,
    tx: GRID_W/2, ty: GRID_H/2,
    moveT:0, frame:0, mood:'happy',
  });
}

function placeBuilding(type, gx, gy, free){
  const def = BDEF[type];
  if(!free){
    for(const k in def.cost){
      if(G.res[k] < def.cost[k]) return false;
    }
  }
  const idx = gy*GRID_W + gx;
  if(G.grid[idx]) return false;
  if(gx<0||gx>=GRID_W||gy<0||gy>=GRID_H) return false;
  if(!free){
    for(const k in def.cost) G.res[k] -= def.cost[k];
  }
  G.grid[idx] = {type, gx, gy, crew:[], t:Math.random()*100, justBuilt:free?0:1};
  if(!free){
    G.constructAnim.push({idx, t:0});
    spawnParticles(gx*TILE+TILE/2, gy*TILE+TILE/2, 'build');
    Sound.build();
  }
  // 应用容量
  if(def.cap){
    if(def.cap.colonist) G.colonistCap = (G.colonistCap||0) + def.cap.colonist;
  }
  if(def.capAdd){
    for(const k in def.capAdd) G.cap[k] += def.capAdd[k];
  }
  if(type==='storage' && G.researchDone.storage2){
    // already applied via capAdd
  }
  if(!free) G.stats.totalBuilt++;
  checkAchievements();
  return true;
}

// ---- Canvas ----
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');
let canvasW=0, canvasH=0, scale=1;

function resizeCanvas(){
  const wrap = document.getElementById('game-wrap');
  const r = wrap.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio||1);
  // 固定内部分辨率（游戏坐标）
  canvasW = VIEW_W * TILE; // 320
  canvasH = VIEW_H * TILE; // 400
  canvas.width = canvasW * dpr;
  canvas.height = canvasH * dpr;
  // CSS 拉伸填满容器
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  scale = 1;
}
window.addEventListener('resize', resizeCanvas);

// ---- 像素绘制辅助 ----
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }

// ---- 建筑绘制 ----
function drawBuilding(type, x, y, t, anim){
  const s = 1; // 像素单位
  ctx.save();
  if(anim){ // 建造动画：从下方升起
    const h = anim; // 0..1
    ctx.translate(0, (1-h)*20);
    ctx.globalAlpha = Math.min(1, h*1.5);
  }
  switch(type){
    case 'habitat': drawHabitat(x,y,t); break;
    case 'solar': drawSolar(x,y,t); break;
    case 'rtg': drawRTG(x,y,t); break;
    case 'oxygen': drawOxygen(x,y,t); break;
    case 'mine': drawMine(x,y,t); break;
    case 'greenhouse': drawGreenhouse(x,y,t); break;
    case 'lab': drawLab(x,y,t); break;
    case 'storage': drawStorage(x,y,t); break;
    case 'comm': drawComm(x,y,t); break;
    case 'rec': drawRec(x,y,t); break;
    case 'core': drawCore(x,y,t); break;
    case 'tradepost': drawTradepost(x,y,t); break;
    case 'medbay': drawMedbay(x,y,t); break;
    case 'observatory': drawObservatory(x,y,t); break;
    case 'waterpur': drawWaterpur(x,y,t); break;
    case 'droidbay': drawDroidbay(x,y,t); break;
    case 'radar': drawRadar(x,y,t); break;
  }
  ctx.restore();
}

  px(x+3, y+30, 34, 2, C.metal);
  px(x+3, y+36, 34, 2, '#1a1a28');

  px(x+8, y+14, 24, 18, C.white);
  px(x+10, y+11, 20, 4, C.white);
  px(x+12, y+9, 16, 3, C.white);
  px(x+14, y+8, 12, 2, C.white);
  // 圆顶高光
  px(x+10, y+13, 4, 10, '#fff');
  px(x+12, y+11, 2, 4, '#fff');
  // 圆顶阴影
  px(x+28, y+14, 4, 14, C.suitDark);
  px(x+30, y+16, 2, 8, C.suitDark);

  px(x+14, y+20, 12, 8, lit?C.glassDark:C.glass);
  px(x+14, y+20, 12, 2, lit?C.glassLight:C.glass);
  px(x+14, y+20, 2, 8, C.glassLight);

  px(x+18, y+28, 4, 2, C.yellow);

  px(x+19, y+2, 2, 8, C.metal);

  px(x+19, y, 2, 2, C.yellow);

function drawCore(x,y,t){
  // 中心核心 - 发光
  const pulse = Math.sin(t*0.1)*0.3+0.7;
  // 基座
  px(x+2, y+32, 36, 6, C.metalDark);
  px(x+2, y+32, 36, 2, C.metal);
  // 主体塔
  px(x+8, y+8, 24, 26, C.metalDark);
  px(x+8, y+8, 24, 2, C.metal);
  px(x+8, y+8, 2, 26, C.metal);
  // 核心能量球
  px(x+12, y+14, 16, 16, C.yellow);
  px(x+14, y+16, 12, 12, C.sunCore);
  px(x+16, y+18, 8, 8, '#fff');
  // 能量环
  const ring = (t*0.05|0)%4;
  ctx.globalAlpha = pulse;
  px(x+10-ring, y+12-ring, 20+ring*2, 2, C.yellow);
  px(x+10-ring, y+30+ring, 20+ring*2, 2, C.yellow);
  ctx.globalAlpha = 1;
  // 放射光
  if(!G.preview && Math.random()<0.4){
    const a = Math.random()*Math.PI*2;
    G.particles.push({x:x+20+Math.cos(a)*8, y:y+22+Math.sin(a)*8, vx:Math.cos(a)*0.8, vy:Math.sin(a)*0.8, life:20, c:C.spark, size:1});
  }
}

// ---- 月球地表 ----
function generateTerrain(){
  const t = [];
  for(let i=0;i<GRID_W*GRID_H;i++){
    t.push({
      v: Math.random(),
      crater: Math.random()<0.08,
      rock: Math.random()<0.06,
    });
  }
  // 添加几个大陨石坑
  for(let k=0;k<5;k++){
    const cx = Math.floor(Math.random()*GRID_W);
    const cy = Math.floor(Math.random()*GRID_H);
    const r = 1+Math.floor(Math.random()*2);
    for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      const x=cx+dx, y=cy+dy;
      if(x<0||x>=GRID_W||y<0||y>=GRID_H) continue;
      if(dx*dx+dy*dy<=r*r) t[y*GRID_W+x].crater=true;
    }
  }
  return t;
}
let terrain = generateTerrain();

function drawTerrain(){
  const sx = Math.floor(G.scrollX), sy = Math.floor(G.scrollY);
  const ox = -(G.scrollX - sx) * TILE;
  const oy = -(G.scrollY - sy) * TILE;
  for(let dy=-1;dy<=VIEW_H+1;dy++){
    for(let dx=-1;dx<=VIEW_W+1;dx++){
      const gx = sx+dx, gy = sy+dy;
      if(gx<0||gx>=GRID_W||gy<0||gy>=GRID_H) continue;
      const t = terrain[gy*GRID_W+gx];
      const x = ox + dx*TILE, y = oy + dy*TILE;
      // 基础地表
      const base = t.v>0.7?C.regolith3 : t.v>0.4?C.regolith2 : C.regolith1;
      px(x, y, TILE, TILE, base);
      // 噪点
      for(let i=0;i<8;i++){
        const nx = x + ((t.v*100+i*37)%TILE);
        const ny = y + ((t.v*200+i*53)%TILE);
        px(nx, ny, 1, 1, t.v>0.5?C.regolithDark:base);
      }
      // 陨石坑
      if(t.crater){
        px(x+8, y+8, 24, 24, C.crater);
        px(x+10, y+10, 20, 20, '#1a1820');
        px(x+12, y+12, 16, 16, '#0a0810');
        px(x+8, y+8, 24, 2, C.craterRim);
        px(x+8, y+8, 2, 24, C.craterRim);
      }
      // 岩石
      if(t.rock && !t.crater){
        const rx = x+10+(t.v*20|0), ry = y+12+(t.v*16|0);
        px(rx, ry, 6, 4, C.regolithDark);
        px(rx+1, ry-1, 4, 2, C.regolith3);
        px(rx+1, ry+3, 4, 1, '#1a1820');
      }
    }
  }
}

// ---- 天空 ----
function drawSky(){
  // 作为装饰叠加层，绘制在右上角（地球+星空+太阳）
  const dayNess = isDay();
  // 星星（夜晚）——散布在画面上半部
  if(!dayNess){
    for(let i=0;i<30;i++){
      const sx = (i*73+13)%(canvasW-60);
      const sy = (i*37+7)%(canvasH*0.18);
      const tw = Math.sin(G.time*Math.PI*2 + i)*0.5+0.5;
      ctx.globalAlpha = 0.3+tw*0.5;
      px(sx, sy, 1, 1, i%5===0?C.star:C.starDim);
    }
    ctx.globalAlpha = 1;
  }
  // 地球（右上角）
  const ex = canvasW - 28, ey = 22;
  const er = 11;
  // 光晕
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = C.earth;
  ctx.beginPath(); ctx.arc(ex, ey, er+4, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  // 本体
  ctx.fillStyle = C.earth;
  ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI*2); ctx.fill();
  // 陆地
  ctx.fillStyle = C.earthLand;
  const rot = G.day * 0.3;
  for(let i=0;i<5;i++){
    const a = rot + i*1.2;
    const lx = ex + Math.cos(a)*er*0.6;
    const ly = ey + Math.sin(a)*er*0.4;
    ctx.fillRect(lx-2, ly-1, 4, 2);
  }
  // 云
  ctx.fillStyle = C.earthCloud;
  ctx.globalAlpha = 0.5;
  ctx.fillRect(ex-5, ey-4, 4, 2);
  ctx.fillRect(ex+2, ey+2, 5, 2);
  ctx.globalAlpha = 1;
  // 阴影侧（立体感）
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.arc(ex+3, ey+2, er, 0, Math.PI*2); ctx.fill();
  // 重绘本体+陆地（让阴影只覆盖右下）
  ctx.fillStyle = C.earth;
  ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = C.earthLand;
  for(let i=0;i<5;i++){
    const a = rot + i*1.2;
    const lx = ex + Math.cos(a)*er*0.6;
    const ly = ey + Math.sin(a)*er*0.4;
    ctx.fillRect(lx-2, ly-1, 4, 2);
  }
  // 太阳（白天清晨低空）
  if(dayNess && G.time < 0.35){
    const sunX = canvasW * (G.time/0.35) * 0.7 + 30;
    const sunY = 22;
    ctx.fillStyle = C.sun;
    ctx.beginPath(); ctx.arc(sunX, sunY, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = C.sunCore;
    ctx.beginPath(); ctx.arc(sunX, sunY, 3, 0, Math.PI*2); ctx.fill();
  }
}

function isDay(){
  return G.time >= 0.0 && G.time < 0.5;
}

// ---- 粒子 ----
function spawnParticles(x, y, type){
  if(type==='build'){
    for(let i=0;i<12;i++){
      G.particles.push({
        x:x+(Math.random()-0.5)*20, y:y+(Math.random()-0.5)*10,
        vx:(Math.random()-0.5)*2, vy:-Math.random()*2-1,
        life:30, c:C.dust, size:1+Math.random()*2,
      });
    }
  } else if(type==='spark'){
    for(let i=0;i<8;i++){
      const a = Math.random()*Math.PI*2;
      G.particles.push({
        x, y, vx:Math.cos(a)*2, vy:Math.sin(a)*2,
        life:20, c:C.spark, size:1,
      });
    }
  }
}

function updateParticles(dt){
  for(let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.05;
    p.life--;
    if(p.life<=0) G.particles.splice(i,1);
  }
  // 浮动文字
  for(let i=G.floats.length-1;i>=0;i--){
    const f = G.floats[i];
    f.y -= 0.5; f.life--;
    if(f.life<=0) G.floats.splice(i,1);
  }
}

function drawParticles(){
  for(const p of G.particles){
    ctx.globalAlpha = Math.min(1, p.life/20);
    px(p.x, p.y, p.size, p.size, p.c);
  }
  ctx.globalAlpha = 1;
  // 浮动文字
  ctx.font = 'bold 9px monospace';
  ctx.textAlign = 'center';
  for(const f of G.floats){
    ctx.globalAlpha = Math.min(1, f.life/30);
    ctx.fillStyle = f.c;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function floatText(x, y, text, c){
  G.floats.push({x, y, text, c, life:40});
}

// ---- 月球车 ----
function updateRover(dt){
  const r = G.rover;
  r.t += dt;
  if(r.t > 2){
    r.t = 0;
    // 选择新目标
    r.tx = 2 + Math.floor(Math.random()*(GRID_W-4));
    r.ty = 2 + Math.floor(Math.random()*(GRID_H-4));
  }
  // 移动
  const dx = r.tx - r.x, dy = r.ty - r.y;
  const d = Math.hypot(dx, dy);
  if(d > 0.1){
    r.x += dx/d * 0.02;
    r.y += dy/d * 0.02;
  }
}

function drawRover(){
  const r = G.rover;
  const sx = (r.x - G.scrollX) * TILE;
  const sy = (r.y - G.scrollY) * TILE;
  if(sx < -20 || sx > canvasW+20 || sy < -20 || sy > canvasH+20) return;
  // 影子
  ctx.globalAlpha = 0.3;
  px(sx-4, sy+6, 12, 2, '#000');
  ctx.globalAlpha = 1;
  // 车身
  px(sx-5, sy-2, 12, 6, C.yellow);
  px(sx-5, sy-2, 12, 2, C.sunCore);
  px(sx-5, sy+2, 12, 2, C.yellowDark);
  // 车轮
  px(sx-5, sy+4, 3, 3, C.metalDark);
  px(sx+2, sy+4, 3, 3, C.metalDark);
  // 天线
  px(sx+1, sy-5, 1, 3, C.metal);
  px(sx, sy-6, 3, 1, C.red);
}

// ---- 船员移动 ----
function updateCrew(dt){
  for(const c of G.crew){
    c.moveT += dt;
    if(c.moveT > 1.5 + Math.random()*2){
      c.moveT = 0;
      // 选择目标：去工作的建筑或随机走
      if(c.job != null && G.grid[c.job]){
        const b = G.grid[c.job];
        c.tx = b.gx + 0.3 + Math.random()*0.4;
        c.ty = b.gy + 0.3 + Math.random()*0.4;
      } else {
        c.tx = Math.max(1, Math.min(GRID_W-2, c.x + (Math.random()-0.5)*4));
        c.ty = Math.max(1, Math.min(GRID_H-2, c.y + (Math.random()-0.5)*4));
      }
    }
    const dx = c.tx - c.x, dy = c.ty - c.y;
    const d = Math.hypot(dx, dy);
    if(d > 0.05){
      c.x += dx/d * 0.015;
      c.y += dy/d * 0.015;
      c.frame = (c.frame + dt*4) % 2;
    }
  }
}

function drawCrew(){
  for(const c of G.crew){
    const sx = (c.x - G.scrollX) * TILE;
    const sy = (c.y - G.scrollY) * TILE;
    if(sx < -20 || sx > canvasW+20 || sy < -20 || sy > canvasH+20) continue;
    drawAstronaut(sx-5, sy-8, c.frame|0, c.mood);
  }
}

// ---- 主渲染 ----
function render(){
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0,0,canvasW,canvasH);
  // 屏幕震动
  ctx.save();
  if(G.shake > 0){
    ctx.translate((Math.random()-0.5)*G.shake, (Math.random()-0.5)*G.shake);
  }
  drawTerrain();
  // 建筑
  const sx = Math.floor(G.scrollX), sy = Math.floor(G.scrollY);
  const ox = -(G.scrollX - sx) * TILE;
  const oy = -(G.scrollY - sy) * TILE;
  for(let dy=-1;dy<=VIEW_H+1;dy++){
    for(let dx=-1;dx<=VIEW_W+1;dx++){
      const gx = sx+dx, gy = sy+dy;
      if(gx<0||gx>=GRID_W||gy<0||gy>=GRID_H) continue;
      const idx = gy*GRID_W+gx;
      const b = G.grid[idx];
      if(!b) continue;
      const x = ox + dx*TILE, y = oy + dy*TILE;
      b.t += 0.5;
      let anim = 0;
      const ca = G.constructAnim.find(a=>a.idx===idx);
      if(ca){ anim = Math.min(1, ca.t); }
      drawBuilding(b.type, x, y, b.t, anim);
    }
  }
  drawCrew();
  drawRover();
  drawParticles();
  drawSky();
  // 建造预览
  if(G.placeMode && G.hover){
    const hx = (G.hover.x - G.scrollX) * TILE;
    const hy = (G.hover.y - G.scrollY) * TILE;
    const def = BDEF[G.placeMode];
    const can = canPlace(G.hover.x, G.hover.y);
    ctx.globalAlpha = 0.6;
    drawBuilding(G.placeMode, hx, hy, 0, 1);
    ctx.globalAlpha = 1;
    // 边框
    ctx.strokeStyle = can?C.good:C.bad;
    ctx.lineWidth = 2;
    ctx.strokeRect(hx, hy, TILE, TILE);
  }
  // 选中高亮
  if(G.selected != null && G.grid[G.selected]){
    const b = G.grid[G.selected];
    const x = (b.gx - G.scrollX) * TILE;
    const y = (b.gy - G.scrollY) * TILE;
    ctx.strokeStyle = C.yellow;
    ctx.lineWidth = 2;
    ctx.strokeRect(x-1, y-1, TILE+2, TILE+2);
  }
  ctx.restore();
  // 夜晚遮罩
  if(!isDay()){
    ctx.fillStyle = 'rgba(5,8,24,0.35)';
    ctx.fillRect(0,0,canvasW,canvasH);
  }
}

function canPlace(gx, gy){
  if(gx<0||gx>=GRID_W||gy<0||gy>=GRID_H) return false;
  const idx = gy*GRID_W+gx;
  if(G.grid[idx]) return false;
  const def = BDEF[G.placeMode];
  if(!def) return false;
  for(const k in def.cost){
    if(G.res[k] < def.cost[k]) return false;
  }
  return true;
}

// ---- 资源更新 ----
function tickResources(dt){
  const day = isDay();
  // 能耗降低科技
  const useMult = G.researchDone.energy2 ? 0.8 : 1;
  // 生产
  for(let i=0;i<G.grid.length;i++){
    const b = G.grid[i];
    if(!b) continue;
    const def = BDEF[b.type];
    if(def.prod){
      let mult = 1;
      // 科技加成
      if(G.researchDone.solar2 && b.type==='solar') mult *= 1.5;
      if(G.researchDone.oxygen2 && b.type==='oxygen') mult *= 1.5;
      if(G.researchDone.mine2 && b.type==='mine') mult *= 1.5;
      if(G.researchDone.farm2 && b.type==='greenhouse') mult *= 1.5;
      if(G.researchDone.lab2 && b.type==='lab') mult *= 1.8;
      // 地表改造全产能加成
      if(G.researchDone.terraform) mult *= 1.2;
      // 机器人车间加成
      if(G.researchDone.robot2 && b.type==='droidbay') mult *= 2;
      // 贸易站被动产金币
      if(b.type==='tradepost'){
        let tradeMult = G.researchDone.trade2 ? 1.5 : 1;
        G.res.credit += 0.3 * tradeMult * dt;
      }
      // 士气加成
      mult *= 0.5 + G.morale/100;
      // 船员加成
      if(def.needCrew){
        const crew = b.crew.length;
        if(crew === 0) continue; // 需要船员才能生产
        mult *= 1 + crew*0.3;
      }
      for(const k in def.prod){
        if(def.dayOnly && !day) continue;
        G.res[k] += def.prod[k] * mult * dt;
      }
    }
    if(def.use){
      for(const k in def.use){
        G.res[k] -= def.use[k] * useMult * dt;
      }
    }
    if(def.morale){
      G.morale = Math.min(100, G.morale + def.morale * dt);
    }
  }
  // 医务室与被动建筑效果
  let healActive = false;
  for(let i=0;i<G.grid.length;i++){
    const b = G.grid[i];
    if(!b) continue;
    if(b.type==='medbay'){
      const healMult = G.researchDone.medbay2 ? 0.6 : 0.3;
      G.healTimer = Math.min(10, G.healTimer + healMult * dt);
      if(G.healTimer >= 5 && G.morale < 85) G.morale = Math.min(100, G.morale + healMult * 0.5 * dt);
      healActive = true;
    }
  }
  // 船员消耗
  const crewCount = G.crew.length;
    // 水循环站减少氧气消耗
  let oxyMult = 1;
  for(let i=0; i<G.grid.length; i++){
    if(G.grid[i] && G.grid[i].type==='waterpur'){ oxyMult = 0.5; break; }
  }
  G.res.oxygen -= crewCount * 0.15 * oxyMult * dt;
  G.res.food -= crewCount * 0.12 * dt;
  // 士气下降（如果资源不足）
  if(G.res.oxygen < 5 || G.res.food < 5){
    G.morale = Math.max(0, G.morale - 5*dt);
    G.deathTimer += dt;
  } else {
    G.deathTimer = Math.max(0, G.deathTimer - dt*0.5);
    if(G.morale < 50){
      G.morale = Math.min(100, G.morale + 1*dt);
    }
  }
  // 资源耗尽+士气归零=Game Over
  if(G.deathTimer > 30 && G.morale <= 0){
    showGameOver();
    return;
  }
  // 限制
  for(const r of RES){
    if(G.res[r.key] < 0) G.res[r.key] = 0;
    if(G.res[r.key] > G.cap[r.key]) G.res[r.key] = G.cap[r.key];
  }
  // 船员心情
  for(const c of G.crew){
    c.mood = G.morale > 60 ? 'happy' : G.morale > 30 ? 'neutral' : 'sad';
  }
}

// ---- 时间推进 ----
function update(dt){
  if(G.paused || G.gameOver) return;
  const sm = G.speed;
  G.time += dt * 0.015 * sm;
  if(G.time >= 1){
    G.time -= 1;
    G.day++;
    onNewDay();
  }
  tickResources(dt * sm);
  updateCrew(dt * sm);
  updateRover(dt * sm);
  updateParticles(dt * sm);
  // 建造动画
  for(let i=G.constructAnim.length-1;i>=0;i--){
    G.constructAnim[i].t += dt*2;
    if(G.constructAnim[i].t >= 1) G.constructAnim.splice(i,1);
  }
  if(G.shake > 0) G.shake = Math.max(0, G.shake - dt*30);
  // 事件检查
  if(G.day >= G.nextEventDay && !G.eventActive){
    triggerEvent();
  }
}

function onNewDay(){
  Sound.day();
  // 每日自动获得10金币
  G.res.credit += 10;
  // 积分过期系统：每天获得2积分，第15天起未研发"积分保护"则过期
  G.expiryPoints += 2;
  if(G.day >= G.expiryDay && !G.researchDone.expiryProtect){
    const expLoss = Math.floor(G.expiryPoints * 0.3);
    G.expiryPoints -= expLoss;
    G.expired += expLoss;
    if(!G.expiryWarned && expLoss > 0){
      G.expiryWarned = true;
      G.paused = true;
      showExpiryWarning(expLoss);
    }
    if(G.expiryPoints < 0) G.expiryPoints = 0;
  }
  // 医疗系统
  if(G.healTimer > 0) G.healTimer--;
  // 清理已完成的贸易要约（资源已在接受时即时交换）
  G.tradeOffers = G.tradeOffers.filter(t=>!t.accepted);
  // 检查胜利
  checkWin();
  // 检查成就
  checkAchievements();
  // 每日自动保存
  saveGame();
}

function checkWin(){
  if(G.won) return;
  // 月球核心已建造 + 20船员
  let hasCore = false;
  for(const b of G.grid) if(b && b.type==='core'){ hasCore = true; break; }
  if(hasCore && G.crew.length >= 20){
    G.won = true;
    showWin();
  }
}

function checkAchievements(){
  const add = (id, name)=>{
    if(!G.achievements.has(id)){
      G.achievements.add(id);
      toast(T('成就解锁：')+name, 'good');
      Sound.achieve();
    }
  };
  if(G.crew.length >= 5) add('crew5', T('小队成立'));
  if(G.crew.length >= 10) add('crew10', T('殖民地'));
  if(G.crew.length >= 20) add('crew20', T('月球都市'));
  if(G.day >= 10) add('day10', T('十日生存'));
  if(G.day >= 30) add('day30', T('月球老兵'));
  if(Object.keys(G.researchDone).length >= 3) add('tech3', T('科研先锋'));
  if(Object.keys(G.researchDone).length >= 7) add('tech7', T('科技大师'));
  if(G.res.credit >= 500) add('rich', T('富甲月球'));
  if(G.res.credit >= 1500) add('rich2', T('月球大亨'));
  if(G.day >= 50) add('day50', T('月球传奇'));
  if(Object.keys(G.researchDone).length >= 12) add('tech12', T('科学家'));
  if(countBuildings() >= 20) add('build20', T('繁荣殖民地'));
  for(let i=0;i<G.grid.length;i++){
    if(G.grid[i] && G.grid[i].type==='medbay'){ add('medbay', T('医疗保障')); break; }
  }
  for(let i=0;i<G.grid.length;i++){
    if(G.grid[i] && G.grid[i].type==='radar'){ add('radar', T('安全第一')); break; }
  }
  for(let i=0;i<G.grid.length;i++){
    if(G.grid[i] && G.grid[i].type==='core'){ add('core', T('核心启动')); break; }
  }
}

function triggerEvent(){
  // 需要通讯塔才能触发部分事件
  let hasComm = false;
  for(const b of G.grid) if(b && b.type==='comm'){ hasComm = true; break; }
  if(!hasComm){
    G.nextEventDay = G.day + 3 + Math.floor(Math.random()*3);
    return;
  }
  G.eventActive = true;
  G.paused = true;
  // 加权随机（过滤掉不需要的事件）
  const pool = EVENTS.filter(e => !e.filter || e.filter());
  let total = pool.reduce((s,e)=>s+(e.weight||1),0);
  let r = Math.random()*total;
  let ev;
  for(const e of pool){ r -= (e.weight||1); if(r<=0){ ev=e; break; } }
  if(!ev) ev = pool[0];
  G.currentEvent = ev;
  showEventPopup(ev);
  G.nextEventDay = G.day + 3 + Math.floor(Math.random()*4);
  G.events++;
  G.stats.totalEvents++;
}

function showTradeMenu(){
  const tradeMult = G.researchDone.trade2 ? 1.5 : 1;
  const offers = [
    {give:'credit', giveAmt:50, get:'mineral', getAmt:Math.floor(30*tradeMult)},
    {give:'credit', giveAmt:50, get:'food', getAmt:Math.floor(30*tradeMult)},
    {give:'mineral', giveAmt:30, get:'credit', getAmt:Math.floor(60*tradeMult)},
    {give:'credit', giveAmt:80, get:'research', getAmt:Math.floor(25*tradeMult)},
    {give:'food', giveAmt:40, get:'credit', getAmt:Math.floor(50*tradeMult)},
    {give:'credit', giveAmt:120, get:'oxygen', getAmt:Math.floor(60*tradeMult)},
  ];
  G.tradeOffers = offers;
  let html = '<span class="close-x" onclick="hideOverlay()">✕</span><h2>'+T('贸易站')+'</h2>';
  html += '<div style="text-align:center;font-size:10px;color:var(--dim);margin-bottom:8px">'+T('当前金币')+': <b style="color:var(--accent)">'+Math.floor(G.res.credit)+'</b>'+(tradeMult>1?' · <span style="color:var(--good)">效率+50%</span>':'')+'</div>';
  html += '<div style="display:flex;flex-direction:column;gap:5px">';
  for(let i=0;i<offers.length;i++){
    const o = offers[i];
    const giveName = T(RES.find(r=>r.key===o.give).name);
    const getName = T(RES.find(r=>r.key===o.get).name);
    const can = G.res[o.give] >= o.giveAmt;
    html += '<button class="evbtn" style="background:'+(can?'#2a3060':'#3a2020')+';color:'+(can?'#e8ecff':'#888')+'" data-trade="'+i+'" '+(can?'':'disabled')+'>'+o.giveAmt+' '+giveName+' → '+o.getAmt+' '+getName+'</button>';
  }
  html += '</div>';
  showOverlay(html);
  document.querySelectorAll('[data-trade]').forEach(btn=>{
    btn.onclick = ()=>{
      const i = parseInt(btn.dataset.trade);
      const o = G.tradeOffers[i];
      if(G.res[o.give] >= o.giveAmt){
        G.res[o.give] -= o.giveAmt;
        G.res[o.get] = Math.min(G.cap[o.get], G.res[o.get] + o.getAmt);
        o.accepted = true;
        floatText(canvasW/2, canvasH/2, T('交易完成！'), C.good);
        Sound.coin();
        btn.disabled = true;
        btn.style.opacity = 0.5;
        // 刷新显示
        setTimeout(()=>showTradeMenu(), 300);
      }
    };
  });
}

  const box = document.getElementById('evbox');
  let html = '<h3>★ '+T(ev.title)+' ★</h3>';
  html += '<canvas id="evcanvas" width="48" height="48"></canvas>';
  html += '<p>'+T(ev.desc)+'</p>';
  if(ev.custom === 'trade'){
    // 贸易选项（与贸易站菜单一致，含科技加成）
    const tradeMult = G.researchDone.trade2 ? 1.5 : 1;
    const offers = [
      {give:'credit', giveAmt:50, get:'mineral', getAmt:Math.floor(30*tradeMult)},
      {give:'credit', giveAmt:50, get:'food', getAmt:Math.floor(30*tradeMult)},
      {give:'mineral', giveAmt:30, get:'credit', getAmt:Math.floor(60*tradeMult)},
      {give:'credit', giveAmt:80, get:'research', getAmt:Math.floor(25*tradeMult)},
      {give:'food', giveAmt:40, get:'credit', getAmt:Math.floor(50*tradeMult)},
      {give:'credit', giveAmt:120, get:'oxygen', getAmt:Math.floor(60*tradeMult)},
    ];
    G.tradeOffers = offers;
    html += '<div style="display:flex;flex-direction:column;gap:5px;margin-bottom:10px">';
    for(let i=0;i<offers.length;i++){
      const o = offers[i];
      const giveName = T(RES.find(r=>r.key===o.give).name);
      const getName = T(RES.find(r=>r.key===o.get).name);
      const can = G.res[o.give] >= o.giveAmt;
      html += '<button class="evbtn" style="background:'+(can?'#2a3060':'#3a2020')+';color:'+(can?'#e8ecff':'#888')+'" data-trade="'+i+'" '+(can?'':'disabled')+'>'+o.giveAmt+' '+giveName+' → '+o.getAmt+' '+getName+'</button>';
    }
    html += '</div>';
    html += '<button class="evbtn" id="ev-close">'+T('关闭')+'</button>';
  } else {
    html += '<button class="evbtn" id="ev-ok">'+T('确定')+'</button>';
  }
  box.innerHTML = html;
  document.getElementById('eventpop').classList.add('on');
  // 绘制事件图标
  const ec = document.getElementById('evcanvas');
  if(ec){
    const ectx = ec.getContext('2d');
    ectx.imageSmoothingEnabled = false;
    drawEventIcon(ectx, ev);
  }
  // 绑定按钮
  if(ev.custom === 'trade'){
    box.querySelectorAll('[data-trade]').forEach(btn=>{
      btn.onclick = ()=>{
        const i = parseInt(btn.dataset.trade);
        const o = G.tradeOffers[i];
        if(G.res[o.give] >= o.giveAmt){
          G.res[o.give] -= o.giveAmt;
          G.res[o.get] = Math.min(G.cap[o.get], G.res[o.get] + o.getAmt);
          o.accepted = true;
          floatText(canvasW/2, canvasH/2, T('交易完成！'), C.good);
          Sound.coin();
          btn.disabled = true;
          btn.style.opacity = 0.5;
        }
      };
    });
    document.getElementById('ev-close').onclick = closeEvent;
  } else {
    document.getElementById('ev-ok').onclick = ()=>{
      ev.apply();
      closeEvent();
    };
  }
}

function closeEvent(){
  document.getElementById('eventpop').classList.remove('on');
  G.eventActive = false;
  G.paused = false;
}

// ---- 音效系统 ----
const Sound = {
  actx: null,
  init(){
    if(this.actx) return;
    try{
      this.actx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.actx.createGain();
      this.master.gain.value = (G.volume!=null?G.volume:0.7);
      this.master.connect(this.actx.destination);
      this.bgmNodes = null;
    }catch(e){}
  },
  setVolume(v){
    G.volume = v;
    try{ localStorage.setItem('lunarColonyVol', String(v)); }catch(e){}
    if(this.master && this.actx) this.master.gain.value = v;
  },
  bgmStart(){
    if(!this.actx || this.bgmNodes) return;
    const ctx = this.actx;
    const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 110;
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 110.5;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400; lp.Q.value = 0.7;
    const g = ctx.createGain(); g.gain.value = 0.04;
    o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(this.master);
    o1.start(); o2.start();
    const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.07;
    const lfoG = ctx.createGain(); lfoG.gain.value = 200;
    lfo.connect(lfoG); lfoG.connect(lp.frequency);
    lfo.start();
    this.bgmNodes = { o1, o2, lfo, g, chimeInterval: setInterval(()=>{
      if(!this.bgmNodes || !G.musicOn) return;
      const notes = [523, 659, 784, 988, 1175];
      const f = notes[Math.floor(Math.random()*notes.length)];
      const co = ctx.createOscillator(); co.type='triangle'; co.frequency.value=f;
      const cg = ctx.createGain(); cg.gain.value=0;
      co.connect(cg); cg.connect(this.master);
      const t = ctx.currentTime;
      cg.gain.setValueAtTime(0, t);
      cg.gain.linearRampToValueAtTime(0.025, t+0.5);
      cg.gain.exponentialRampToValueAtTime(0.001, t+3);
      co.start(t); co.stop(t+3.2);
    }, 9000) };
  },
  bgmStop(){
    if(!this.bgmNodes) return;
    try{
      clearInterval(this.bgmNodes.chimeInterval);
      this.bgmNodes.o1.stop();
      this.bgmNodes.o2.stop();
      this.bgmNodes.lfo.stop();
    }catch(e){}
    this.bgmNodes = null;
  },
  bgmToggle(on){
    G.musicOn = on;
    try{ localStorage.setItem('lunarColonyMusic', on?'1':'0'); }catch(e){}
    if(on) this.bgmStart(); else this.bgmStop();
  },
  beep(freq, dur, type='square', vol=0.08){
    if(!G.soundOn || !this.actx) return;
    const mvol = (G.volume!=null?G.volume:0.7) * vol;
    const t = this.actx.currentTime;
    const o = this.actx.createOscillator();
    const g = this.actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(mvol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(this.master || this.actx.destination);
    o.start(t); o.stop(t+dur);
  },
  click(){ this.beep(880, 0.04, 'square', 0.05); },
  build(){ this.beep(440,0.08); setTimeout(()=>this.beep(660,0.12),70); },
  error(){ this.beep(140, 0.2, 'sawtooth', 0.08); },
  coin(){ this.beep(988,0.06); setTimeout(()=>this.beep(1319,0.1),50); },
  day(){ this.beep(523,0.08); setTimeout(()=>this.beep(659,0.08),80); setTimeout(()=>this.beep(784,0.15),160); },
  alert(){ this.beep(440,0.1,'sawtooth',0.1); setTimeout(()=>this.beep(440,0.1,'sawtooth',0.1),140); },
  success(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.beep(f,0.12),i*70)); },
  place(){ this.beep(330,0.05); setTimeout(()=>this.beep(550,0.08),40); },
  demolish(){ this.beep(220,0.1,'sawtooth',0.07); setTimeout(()=>this.beep(110,0.15,'sawtooth',0.07),80); },
  recruit(){ this.beep(659,0.06); setTimeout(()=>this.beep(880,0.06),60); setTimeout(()=>this.beep(1047,0.1),120); },
  research(){ this.beep(784,0.08,'triangle',0.06); setTimeout(()=>this.beep(988,0.08,'triangle',0.06),70); setTimeout(()=>this.beep(1319,0.15,'triangle',0.06),140); },
  trade(){ this.beep(988,0.05); setTimeout(()=>this.beep(1175,0.07),50); setTimeout(()=>this.beep(988,0.05),120); },
  achieve(){ [659,784,988,1319,1568].forEach((f,i)=>setTimeout(()=>this.beep(f,0.13,'triangle',0.06),i*80)); },
  warning(){ this.beep(330,0.12,'sawtooth',0.1); setTimeout(()=>this.beep(247,0.18,'sawtooth',0.1),130); },
  levelup(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>this.beep(f,0.1,'square',0.05),i*55)); },
};

// ---- UI ----
function updateHUD(){
  // 资源
  const rr = document.getElementById('resrow');
  let html = '';
  for(let ri=0; ri<RES.length; ri++){
    const r = RES[ri];
    if(r.key==='expiry' && G.day < 15) continue;
    const v = Math.floor(G.res[r.key]);
    const cap = G.cap[r.key] >= 9999 ? '∞' : Math.floor(G.cap[r.key]);
    const low = v < (typeof cap==='number'?cap*0.1:10);
    html += '<div class="res"><canvas class="ic" width="10" height="10" data-res="'+ri+'"></canvas><span class="v" style="color:'+(low?'#ff6b6b':'')+'">'+v+'</span><span class="c">/'+cap+'</span></div>';
  }
  rr.innerHTML = html;
  // 绘制资源图标
  rr.querySelectorAll('[data-res]').forEach(cv=>{
    const ri = parseInt(cv.dataset.res);
    drawResIcon(cv.getContext('2d'), RES[ri].key);
  });
  // 日期
  document.getElementById('daytxt').textContent = TF('第%s日', G.day);
  const hour = Math.floor(G.time*24);
  const min = Math.floor((G.time*24 - hour)*60);
  document.getElementById('timetxt').textContent = String(hour).padStart(2,'0')+':'+String(min).padStart(2,'0');
  // 士气
  const mf = document.getElementById('moralefill');
  mf.style.width = G.morale+'%';

}

function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = type||'';
  t.classList.add('on');
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove('on'), 1800);
}

function showOverlay(html){
  document.getElementById('panel').innerHTML = html;
  document.getElementById('overlay').classList.add('on');
}
function hideOverlay(){
  document.getElementById('overlay').classList.remove('on');
}

function showBuildMenu(){
  // 统计各类建筑数量
  const counts = {};
  for(const b of G.grid) if(b) counts[b.type] = (counts[b.type]||0)+1;
  let html = '<span class="close-x" onclick="hideOverlay()">✕</span><h2>'+T('建造')+'</h2><div class="blist">';
  for(const key in BDEF){
    const def = BDEF[key];
    const unlocked = def.unlock || G.unlocked[def.tech];
    if(!unlocked) continue;
    let canAfford = true;
    for(const k in def.cost) if(G.res[k] < def.cost[k]) canAfford = false;
    const costStr = Object.entries(def.cost).map(([k,v])=>v+' '+T(RES.find(r=>r.key===k).name)).join(' ');
    const cnt = counts[key]||0;
    html += '<div class="bcard'+(canAfford?'':' cant')+'" data-build="'+key+'">';
    html += '<canvas width="32" height="32" data-spr="'+key+'"></canvas>';
    html += '<div class="info"><div class="nm">'+T(def.name)+(cnt>0?' <span style="color:var(--good);font-size:8px">×'+cnt+'</span>':'')+'</div>';
    html += '<div class="cost">'+costStr+'</div>';
    html += '<div class="desc">'+T(def.desc)+'</div></div></div>';
  }
  html += '</div>';
  showOverlay(html);
  // 绘制建筑预览
  document.querySelectorAll('[data-spr]').forEach(cv=>{
    const key = cv.dataset.spr;
    const c = cv.getContext('2d');
    c.imageSmoothingEnabled = false;
    drawSpriteToCanvas(c, key);
  });
  // 绑定
  document.querySelectorAll('[data-build]').forEach(card=>{
    card.onclick = ()=>{
      const key = card.dataset.build;
      const def = BDEF[key];
      let can = true;
      for(const k in def.cost) if(G.res[k] < def.cost[k]) can = false;
      if(!can){ toast(T('资源不足！'), 'bad'); Sound.error(); return; }
      G.placeMode = key;
      hideOverlay();
      document.getElementById('btn-build').classList.add('on');
      setInfo(T('选中：')+T(def.name)+T('。点击地图放置，按建造键取消。'));
      Sound.click();
    };
  });
}

function drawSpriteToCanvas(c, type){
  // 在小canvas上绘制建筑预览
  c.fillStyle = '#0a0e1a';
  c.fillRect(0,0,32,32);
  const oldCtx = ctx;
  ctx = c;
  G.preview = true;
  c.save();
  c.translate(-4,-4);
  drawBuilding(type, 0, 0, 0, 1);
  c.restore();
  G.preview = false;
  ctx = oldCtx;
}

function showResearchMenu(){
  let html = '<span class="close-x" onclick="hideOverlay()">✕</span><h2>'+T('科研中心')+'</h2>';
  html += '<div style="text-align:center;margin-bottom:8px;font-size:10px;color:var(--c-research)">'+T('科研点')+': <b style="color:var(--text)">'+Math.floor(G.res.research)+'</b></div>';
  html += '<div class="rlist">';
  for(const key in RDEF){
    const r = RDEF[key];
    const done = G.researchDone[key];
    const can = G.res.research >= r.cost;
    let cls = '';
    if(done) cls = 'done';
    else if(can) cls = 'afford';
    html += '<div class="rcard '+cls+'" data-res="'+key+'">';
    html += '<div class="info"><div class="nm">'+T(r.name)+'</div>';
    html += '<div class="cost">'+T('消耗')+': '+r.cost+' '+T('科研点')+'</div>';
    html += '<div class="eff">'+T(r.desc)+'</div>';
    if(done) html += '<div class="st" style="color:var(--good)">✓ '+T('已研发')+'</div>';
    html += '</div></div>';
  }
  html += '</div>';
  showOverlay(html);
  document.querySelectorAll('[data-res]').forEach(card=>{
    card.onclick = ()=>{
      const key = card.dataset.res;
      const r = RDEF[key];
      if(G.researchDone[key]) return;
      if(G.res.research < r.cost){ toast(T('科研点不足！'), 'bad'); Sound.error(); return; }
      G.res.research -= r.cost;
      G.researchDone[key] = true;
      if(r.unlock) G.unlocked[r.unlock] = true;
      if(r.boost){
        if(r.boost.cap) for(const k in G.cap) if(k!=='credit'&&k!=='research') G.cap[k] += r.boost.cap;
        if(r.boost.habitatCap){
          for(const b of G.grid) if(b && b.type==='habitat') G.colonistCap += r.boost.habitatCap;
        }
      }
      toast(T('研发成功：')+T(r.name), 'good');
      Sound.research();
      showResearchMenu();
    };
  });
}

function showCrewMenu(){
  let html = '<span class="close-x" onclick="hideOverlay()">✕</span><h2>'+T('船员管理')+'</h2>';
  html += '<div style="text-align:center;margin-bottom:8px;font-size:10px;color:var(--dim)">'+T('船员')+': <b style="color:var(--text)">'+G.crew.length+'</b> / <b style="color:var(--text)">'+(G.colonistCap||0)+'</b></div>';
  // 招募
  let recruitCost = 50 + G.crew.length*20;
  if(G.researchDone.recruit) recruitCost = Math.floor(recruitCost * 0.7);
  const canRecruit = G.res.credit >= recruitCost && G.crew.length < (G.colonistCap||0);
  html += '<button class="mbtn" id="recruit-btn" '+(canRecruit?'':'disabled')+'>'+T('招募新船员')+' ('+recruitCost+' '+T('金币')+')</button>';
  html += '<div class="clist" style="margin-top:8px">';
  for(const c of G.crew){
    const job = c.job!=null && G.grid[c.job] ? T(BDEF[G.grid[c.job].type].name) : T('空闲');
    html += '<div class="ccard">';
    html += '<canvas width="28" height="28" data-crew="'+c.id+'"></canvas>';
    html += '<div class="info"><div class="nm">'+c.name+'</div>';
    html += '<div class="stat">'+T('采矿')+'<b>'+c.mining+'</b> '+T('务农')+'<b>'+c.farming+'</b> '+T('科研')+'<b>'+c.science+'</b> '+T('工程')+'<b>'+c.eng+'</b></div>';
    if(c.job!=null){
      html += '<div class="asg">'+T('职业')+': '+job+' <button class="mbtn" style="display:inline;width:auto;padding:2px 6px;font-size:9px;margin-top:0" data-unassign="'+c.id+'">'+T('取消分配')+'</button></div>';
    } else {
      html += '<div class="asg">'+T('职业')+': '+job+'</div>';
    }
    html += '</div></div>';
  }
  html += '</div>';
  showOverlay(html);
  // 绘制头像
  document.querySelectorAll('[data-crew]').forEach(cv=>{
    const c = cv.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.fillStyle = '#0a0e1a';
    c.fillRect(0,0,28,28);
    const oldCtx = ctx;
    ctx = c;
    G.preview = true;
    drawAstronaut(8, 4, 0, 'happy');
    G.preview = false;
    ctx = oldCtx;
  });
  document.getElementById('recruit-btn').onclick = ()=>{
    if(G.res.credit < recruitCost) return;
    if(G.crew.length >= (G.colonistCap||0)){ toast(T('居住舱不足！'), 'bad'); Sound.error(); return; }
    G.res.credit -= recruitCost;
    const names = [T('伽马'),T('德尔塔'),T('艾普西龙'),T('泽塔'),T('伊塔'),T('西塔'),T('艾欧塔'),T('卡帕'),T('拉姆'),T('缪')];
    const n = names[Math.floor(Math.random()*names.length)];
    const stats = {mining:1+Math.floor(Math.random()*4), farming:1+Math.floor(Math.random()*4), science:1+Math.floor(Math.random()*4), eng:1+Math.floor(Math.random()*4)};
    addCrew(n+' '+Math.floor(Math.random()*100), stats);
    G.stats.totalRecruited++;
    toast(T('新船员加入！'), 'good');
    Sound.recruit();
    showCrewMenu();
  };
  // 取消分配按钮
  document.querySelectorAll('[data-unassign]').forEach(btn=>{
    btn.onclick = ()=>{
      const cid = parseInt(btn.dataset.unassign);
      const c = G.crew.find(x=>x.id===cid);
      if(c && c.job!=null){
        const b = G.grid[c.job];
        if(b){
          const idx = b.crew.indexOf(cid);
          if(idx>=0) b.crew.splice(idx,1);
        }
        c.job = null;
        toast(c.name+T(' 已取消分配'), 'good');
        Sound.click();
        showCrewMenu();
      }
    };
  });
}

function showMenu(){
  let html = '<span class="close-x" onclick="hideOverlay()">✕</span><h2>'+T('菜单')+'</h2>';
  html += '<div class="mlist">';
  html += '<div class="mitem"><div class="t">'+T('游戏状态')+'</div><div class="d">'+T('第')+' <b>'+G.day+'</b> '+T('日')+' · '+T('船员')+' <b>'+G.crew.length+'</b> '+T('人')+' · '+T('建筑')+' <b>'+countBuildings()+'</b> '+T('座')+' · '+T('科技')+' <b>'+Object.keys(G.researchDone).length+'</b> '+T('项')+' · '+T('成就')+' <b>'+G.achievements.size+'</b> '+T('个')+' · '+T('事件')+' <b>'+G.stats.totalEvents+'</b> '+T('次')+' · '+T('招募')+' <b>'+G.stats.totalRecruited+'</b> '+T('人')+' · '+T('游玩时间')+' <b>'+Math.floor((Date.now()-G.stats.startTime)/60000)+'</b> '+T('分钟')+'</div></div>';
  // 产量统计
  html += '<div class="mitem"><div class="t">'+T('资源动态')+'</div><div class="d" id="res-stats">'+T('计算中...')+'</div></div>';
  html += '<div class="mitem"><div class="t">' + T('音效') + '</div><div class="d"><div style="display:flex;flex-direction:column;gap:8px;"><div>' + T('当前') + ': ' + (G.soundOn?T('ON'):T('OFF')) + ' &nbsp; <button class="mbtn" id="sound-toggle">' + (G.soundOn?T('ON'):T('OFF')) + '</button></div><div>' + T('音量') + ': <input type="range" id="vol-slider" min="0" max="100" value="' + Math.round((G.volume??0.7)*100) + '" style="vertical-align:middle;width:60%;"></div><div>' + T('背景音乐') + ': ' + (G.musicOn?T('ON'):T('OFF')) + ' <button class="mbtn" id="music-toggle">' + (G.musicOn?T('ON'):T('OFF')) + '</button> <button class="mbtn" id="sound-test">' + T('测试') + '</button></div></div></div></div>';
  html += '<div class="mitem"><div class="t">'+T('存档')+'</div><div class="d">'+T('保存进度到本地')+'</div><button class="mbtn" id="save-btn">'+T('保存游戏')+'</button><button class="mbtn" id="load-btn">'+T('读取存档')+'</button></div>';
  html += '<div class="mitem"><div class="t">'+T('成就')+' ('+G.achievements.size+'/15)</div><div class="d">';
  const achs = [
    ['crew5',T('小队成立'),T('5名船员')],
    ['crew10',T('殖民地'),T('10名船员')],
    ['crew20',T('月球都市'),T('20名船员')],
    ['day10',T('十日生存'),T('第10天')],
    ['day30',T('月球老兵'),T('第30天')],
    ['day50',T('月球传奇'),T('第50天')],
    ['tech3',T('科研先锋'),T('3项科技')],
    ['tech7',T('科技大师'),T('7项科技')],
    ['tech12',T('科学家'),T('12项科技')],
    ['rich',T('富甲月球'),T('500金币')],
    ['rich2',T('月球大亨'),T('1500金币')],
    ['core',T('核心启动'),T('建造月球核心')],
    ['build20',T('繁荣殖民地'),T('20座建筑')],
    ['medbay',T('医疗保障'),T('建造医务室')],
    ['radar',T('安全第一'),T('建造雷达站')],
  ];
  for(const [id,name,desc] of achs){
    html += (G.achievements.has(id)?'✓':'○')+' '+name+' ('+desc+')<br>';
  }
  html += '</div></div>';
  html += '<div class="mitem"><div class="t">'+T('重新开始')+'</div><div class="d">'+T('清除当前进度，重新开始游戏')+'</div><button class="mbtn danger" id="reset-btn">'+T('重新开始')+'</button></div>';
  html += '</div>';
  showOverlay(html);
  // 计算资源动态
  const useMult = G.researchDone.energy2 ? 0.8 : 1;
  const rates = {energy:0,oxygen:0,mineral:0,food:0,credit:0,research:0};
  const day = isDay();
  for(let i=0;i<G.grid.length;i++){
    const b = G.grid[i]; if(!b) continue;
    const def = BDEF[b.type];
    if(def.prod){
      let mult = 0.5 + G.morale/100;
      if(def.needCrew && b.crew.length===0) continue;
      if(def.needCrew) mult *= 1 + b.crew.length*0.3;
      if(G.researchDone.solar2 && b.type==='solar') mult *= 1.5;
      if(G.researchDone.mine2 && b.type==='mine') mult *= 1.5;
      if(G.researchDone.farm2 && b.type==='greenhouse') mult *= 1.5;
      if(G.researchDone.lab2 && b.type==='lab') mult *= 1.8;
      // 地表改造全产能加成
      if(G.researchDone.terraform) mult *= 1.2;
      // 机器人车间加成
      if(G.researchDone.robot2 && b.type==='droidbay') mult *= 2;
      if(b.type==='tradepost'){ rates.credit += 0.3 * (G.researchDone.trade2?1.5:1); }
      for(const k in def.prod){
        if(def.dayOnly && !day) continue;
        rates[k] += def.prod[k] * mult;
      }
    }
    if(def.use){
      for(const k in def.use) rates[k] -= def.use[k] * useMult;
    }
  }
  rates.oxygen -= G.crew.length * 0.15;
  // 水循环站减少氧气消耗
  for(let i=0;i<G.grid.length;i++){
    if(G.grid[i] && G.grid[i].type==='waterpur'){ rates.oxygen += G.crew.length * 0.15 * 0.5; break; }
  }
  rates.food -= G.crew.length * 0.12;
  let rateHtml = '';
  for(const r of RES){
    const v = rates[r.key];
    const sign = v >= 0 ? '+' : '';
    const color = v >= 0 ? 'var(--good)' : 'var(--bad)';
    rateHtml += T(r.name)+': <b style="color:'+color+'">'+sign+v.toFixed(1)+'/s</b> · '+T('当前')+': <b>'+Math.floor(G.res[r.key])+'</b><br>';
  }
  document.getElementById('res-stats').innerHTML = rateHtml;
  document.getElementById('sound-toggle').onclick = ()=>{
    G.soundOn = !G.soundOn;
    if(G.soundOn){ Sound.init(); Sound.click(); }
    showMenu();
  };
  const vs = document.getElementById('vol-slider');
  if(vs){
    vs.oninput = ()=>{
      const v = parseInt(vs.value)/100;
      Sound.setVolume(v);
    };
  }
  document.getElementById('music-toggle').onclick = ()=>{
    Sound.init();
    Sound.bgmToggle(!G.musicOn);
    showMenu();
  };
  document.getElementById('sound-test').onclick = ()=>{
    Sound.init();
    Sound.success();
  };
  document.getElementById('save-btn').onclick = ()=>{
    saveGame();
    toast(T('已保存'), 'good');
  };
  document.getElementById('load-btn').onclick = ()=>{
    if(loadGame()){ toast(T('已读取'), 'good'); hideOverlay(); }
    else toast(T('无存档'), 'bad');
  };
  document.getElementById('reset-btn').onclick = ()=>{
    // 用自定义确认代替 confirm()
    const btn = document.getElementById('reset-btn');
    if(btn.dataset.confirmed === '1'){
      localStorage.removeItem('lunarColony');
      newGame();
      hideOverlay();
      toast(T('新游戏开始'), 'good');
    } else {
      btn.dataset.confirmed = '1';
      btn.textContent = T('再次点击确认重置');
      btn.style.background = 'var(--bad)';
      btn.style.color = '#fff';
      setTimeout(()=>{
        btn.dataset.confirmed = '0';
        btn.textContent = T('重新开始');
        btn.style.background = '';
        btn.style.color = '';
      }, 3000);
    }
  };
}

}

// ---- 选中建筑信息 ----
function showSelInfo(idx){
  const b = G.grid[idx];
  if(!b){ document.getElementById('selinfo').classList.remove('on'); return; }
  const def = BDEF[b.type];
  let html = '<div class="sn">'+T(def.name)+'</div>';
  html += '<div class="sd">';
  if(def.prod){
    for(const k in def.prod){
      html += T('产 ')+def.prod[k].toFixed(1)+T('/秒 ')+T(RES.find(r=>r.key===k).name)+' ';
    }
  }
  if(def.use){
    for(const k in def.use){
      html += T('耗 ')+def.use[k].toFixed(2)+T('/秒 ')+T(RES.find(r=>r.key===k).name)+' ';
    }
  }
  if(def.needCrew){
    html += '<br>'+T('分配船员')+': '+b.crew.length+T('（需至少1人）');
    if(b.crew.length > 0){
      html += ' <button class="mbtn" style="display:inline;width:auto;padding:2px 6px;font-size:9px;margin-top:0" data-unassign-all="'+idx+'">'+T('全部撤回')+'</button>';
    }
  }
  if(def.cap && def.cap.colonist) html += '<br>'+T('提供居住')+': +'+def.cap.colonist;
  html += '</div>';
  if(def.needCrew){
    html += '<div class="act"><button class="asg" data-idx="'+idx+'">'+T('分配船员')+'</button><button class="del" data-del="'+idx+'">'+T('拆除')+'</button></div>';
  } else if(b.type==='tradepost'){
    html += '<div class="act"><button class="asg" data-trade-open="'+idx+'" style="background:linear-gradient(180deg,#5a4015,#3a2810);border-color:var(--accent);color:var(--accent)">'+T('贸易')+'</button><button class="del" data-del="'+idx+'">'+T('拆除')+'</button></div>';
  } else {
    html += '<div class="act"><button class="del" data-del="'+idx+'">'+T('拆除')+'</button></div>';
  }
  const el = document.getElementById('selinfo');
  el.innerHTML = html;
  el.classList.add('on');
  const asgBtn = el.querySelector('[data-idx]');
  if(asgBtn) asgBtn.onclick = ()=>assignCrew(idx);
  const delBtn = el.querySelector('[data-del]');
  if(delBtn) delBtn.onclick = ()=>demolish(idx);
  const tradeOpenBtn = el.querySelector('[data-trade-open]');
  if(tradeOpenBtn) tradeOpenBtn.onclick = ()=>showTradeMenu();
  const unassignAllBtn = el.querySelector('[data-unassign-all]');
  if(unassignAllBtn) unassignAllBtn.onclick = ()=>{
    for(const cid of b.crew){
      const c = G.crew.find(x=>x.id===cid);
      if(c) c.job = null;
    }
    b.crew = [];
    toast(T('已撤回全部船员'), 'good');
    Sound.click();
    showSelInfo(idx);
  };
}

function assignCrew(idx){
  const b = G.grid[idx];
  if(!b) return;
  // 找一个空闲船员
  const free = G.crew.filter(c=>c.job==null);
  if(free.length===0){ toast(T('没有空闲船员！'), 'bad'); Sound.error(); return; }
  const c = free[0];
  c.job = idx;
  b.crew.push(c.id);
  toast(c.name+T(' 已分配'), 'good');
  Sound.click();
  showSelInfo(idx);
}

function demolish(idx){
  const b = G.grid[idx];
  if(!b) return;
  Sound.demolish();
  // 释放船员
  for(const cid of b.crew){
    const c = G.crew.find(x=>x.id===cid);
    if(c) c.job = null;
  }
  const def = BDEF[b.type];
  if(def.cap && def.cap.colonist){
    G.colonistCap -= def.cap.colonist;
    // 如果船员数超过上限，移除多余的
    while(G.crew.length > G.colonistCap && G.crew.length > 0){
      const removed = G.crew.pop();
      toast(removed.name+T(' 因居住舱不足离开了殖民地'), 'bad');
    }
  }
  if(def.capAdd){ for(const k in def.capAdd) G.cap[k] -= def.capAdd[k]; }
  // 返还一半资源
  if(def.cost){
    for(const k in def.cost) G.res[k] = Math.min(G.cap[k], G.res[k] + Math.floor(def.cost[k]/2));
  }
  G.grid[idx] = null;
  G.selected = null;
  document.getElementById('selinfo').classList.remove('on');
  spawnParticles((b.gx-G.scrollX)*TILE+TILE/2, (b.gy-G.scrollY)*TILE+TILE/2, 'build');
  Sound.error();
  toast(T('已拆除（返还50%资源）'), 'good');
}

// ---- 存档 ----
function saveGame(){
  try{
    const data = JSON.parse(JSON.stringify(G));
    data.achievements = Array.from(G.achievements);
    data.terrain = terrain;
    localStorage.setItem('lunarColony', JSON.stringify(data));
  }catch(e){}
}
function loadGame(){
  try{
    const s = localStorage.getItem('lunarColony');
    if(!s) return false;
    const data = JSON.parse(s);
    data.achievements = new Set(data.achievements||[]);
    if(data.terrain) terrain = data.terrain;
    G = data;
    try{
      const v = localStorage.getItem('lunarColonyVol');
      if(v!=null) G.volume = parseFloat(v);
      G.musicOn = localStorage.getItem('lunarColonyMusic')==='1';
    }catch(e){}
    return true;
  }catch(e){ return false; }
}

// ---- 输入处理 ----
let touchStart = null, touchLast = null, isDragging = false, dragMoved = false;

function getEventPos(e){
  const r = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  // 将CSS坐标映射到游戏内部坐标
  const gx = (t.clientX - r.left) * (canvasW / r.width);
  const gy = (t.clientY - r.top) * (canvasH / r.height);
  return {x: gx, y: gy};
}

function screenToGrid(px, py){
  return {x: Math.floor(px / TILE + G.scrollX), y: Math.floor(py / TILE + G.scrollY)};
}

canvas.addEventListener('touchstart', (e)=>{
  e.preventDefault();
  const p = getEventPos(e);
  touchStart = {...p};
  touchLast = {...p};
  isDragging = false;
  dragMoved = false;
}, {passive:false});

canvas.addEventListener('touchmove', (e)=>{
  e.preventDefault();
  if(!touchLast) return;
  const p = getEventPos(e);
  const dx = p.x - touchLast.x;
  const dy = p.y - touchLast.y;
  if(Math.abs(p.x-touchStart.x)>5 || Math.abs(p.y-touchStart.y)>5) dragMoved = true;
  G.scrollX -= dx / TILE;
  G.scrollY -= dy / TILE;
  clampScroll();
  touchLast = p;
  // 更新hover
  if(G.placeMode){
    G.hover = screenToGrid(p.x, p.y);
  }
}, {passive:false});

canvas.addEventListener('touchend', (e)=>{
  e.preventDefault();
  if(!dragMoved){
    // 点击
    const p = touchStart;
    const g = screenToGrid(p.x, p.y);
    onTap(g);
  }
  touchStart = null;
  touchLast = null;
}, {passive:false});

// 鼠标支持（桌面测试）
canvas.addEventListener('mousedown', (e)=>{
  const p = getEventPos(e);
  touchStart = {...p};
  touchLast = {...p};
  isDragging = false;
  dragMoved = false;
});
canvas.addEventListener('mousemove', (e)=>{
  if(!touchLast) return;
  const p = getEventPos(e);
  const dx = p.x - touchLast.x;
  const dy = p.y - touchLast.y;
  if(Math.abs(p.x-touchStart.x)>5 || Math.abs(p.y-touchStart.y)>5) dragMoved = true;
  G.scrollX -= dx / TILE;
  G.scrollY -= dy / TILE;
  clampScroll();
  touchLast = p;
  if(G.placeMode){
    G.hover = screenToGrid(p.x, p.y);
  }
});
canvas.addEventListener('mouseup', (e)=>{
  if(!touchStart) return;
  if(!dragMoved){
    const g = screenToGrid(touchStart.x, touchStart.y);
    onTap(g);
  }
  touchStart = null;
  touchLast = null;
});
canvas.addEventListener('mouseleave', ()=>{ touchStart=null; touchLast=null; });

function clampScroll(){
  G.scrollX = Math.max(0, Math.min(GRID_W - VIEW_W, G.scrollX));
  G.scrollY = Math.max(0, Math.min(GRID_H - VIEW_H, G.scrollY));
}

function onTap(g){
  if(g.x<0||g.x>=GRID_W||g.y<0||g.y>=GRID_H) return;
  const idx = g.y*GRID_W + g.x;
  if(G.placeMode){
    // 建造模式
    if(canPlace(g.x, g.y)){
      placeBuilding(G.placeMode, g.x, g.y, false);
      Sound.place();
      // 保持建造模式，可连续建造
      const def = BDEF[G.placeMode];
      let can = true;
      for(const k in def.cost) if(G.res[k] < def.cost[k]) can = false;
      if(!can){
        G.placeMode = null;
        document.getElementById('btn-build').classList.remove('on');
        setInfo(T('资源不足，已退出建造模式。'));
      } else {
        setInfo(T('继续点击放置 ')+T(def.name)+T('，或按建造键退出。'));
      }
    } else {
      toast(T('无法放置在此处'), 'bad');
      Sound.error();
    }
  } else {
    // 选中建筑
    if(G.grid[idx]){
      G.selected = idx;
      showSelInfo(idx);
      Sound.click();
    } else {
      G.selected = null;
      document.getElementById('selinfo').classList.remove('on');
    }
  }
}

// ---- 主循环 ----
let lastT = 0;
function loop(t){
  const dt = Math.min(0.1, (t - lastT)/1000);
  lastT = t;
  if(G){
    update(dt);
    render();
    updateHUD();
  }
  requestAnimationFrame(loop);
}

// 初始化
newGame();
resizeCanvas();
drawTitle();
requestAnimationFrame(loop);

// 防止页面滚动
document.body.addEventListener('touchmove', (e)=>e.preventDefault(), {passive:false});
document.addEventListener('gesturestart', (e)=>e.preventDefault());

// ---- 键盘快捷键 ----
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){
    if(G.placeMode){
      G.placeMode = null;
      document.getElementById('btn-build').classList.remove('on');
      setInfo(T('已取消建造模式。'));
    } else {
      hideOverlay();
      document.getElementById('eventpop').classList.remove('on');
      if(G.eventActive){ G.eventActive = false; G.paused = false; }
    }
  } else if(e.key>='0' && e.key<='5'){
    const spd = parseInt(e.key);
    if(spd===0 || spd===1 || spd===3 || spd===5){
      G.speed = spd;
      G.paused = spd === 0;
      document.querySelectorAll('.spd').forEach(b=>{
        b.classList.toggle('on', parseInt(b.dataset.spd)===spd);
      });
      Sound.click();
    }
  }
});
